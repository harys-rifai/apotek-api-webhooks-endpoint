{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — ApotekMonitor</title>
  <link rel="stylesheet" href="{% static 'css/theme.css' %}"/>
  <link rel="stylesheet" href="{% static 'css/main.css' %}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous"/>
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-card__header">
      <div class="login-card__logo">⚕</div>
      <h1 class="login-card__title">ApotekMonitor</h1>
      <p class="login-card__sub">API Monitoring Dashboard</p>
    </div>

    {% if login_error %}
      <div class="alert alert--error">
        <i class="fa-solid fa-circle-exclamation"></i> {{ login_error }}
      </div>
    {% endif %}

    <form method="post" class="login-card__form">
      {% csrf_token %}
      <div class="form-group">
        <label for="username"><i class="fa-solid fa-user"></i> Username</label>
        <input type="text" id="username" name="username" class="form-control"
               placeholder="admin" required autofocus autocomplete="username"/>
      </div>
      <div class="form-group">
        <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="••••••••" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn btn-primary btn--full" style="margin-top:8px">
        <i class="fa-solid fa-right-to-bracket"></i> Masuk
      </button>
    </form>

    <p class="login-card__hint">Default login: <code>admin / admin</code></p>
  </div>
</body>
</html>
